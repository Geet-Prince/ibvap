  <line x1="24" y1="29.5" x2="24" y2="32" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" />
  <line x1="12.5" y1="24" x2="15" y2="24" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" />
  <line x1="33" y1="24" x2="35.5" y2="24" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" />
</svg>